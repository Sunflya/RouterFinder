name: RouterFinder
options:
  bundleIdPrefix: com.sunflya
  deploymentTarget:
    iOS: "17.2"
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  TARGETED_DEVICE_FAMILY: "1"
  SUPPORTED_PLATFORMS: "iphoneos"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
  ENABLE_PREVIEWS: YES
  IPHONEOS_DEPLOYMENT_TARGET: "17.2"
  MARKETING_VERSION: "1.1"
  CURRENT_PROJECT_VERSION: "2"
  ENABLE_BITCODE: NO

targets:
  RouterFinder:
    type: application
    platform: iOS
    sources:
      - path: RouterFinder
    settings:
      # 关键：可执行文件名必须保持 RouterFinder，否则打包脚本会找不到
      # Payload/RouterFinder.app/RouterFinder；中文名只放在 CFBundleDisplayName。
      PRODUCT_NAME: "RouterFinder"
      PRODUCT_BUNDLE_IDENTIFIER: "com.sunflya.routerfinder"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: "RouterFinder/RouterFinder-Bridging-Header.h"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "路由器探测"
        CFBundleName: "RouterFinder"
        CFBundleExecutable: "RouterFinder"
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSLocalNetworkUsageDescription: "需要访问局域网，以发现 DHCP 路由器与其他网络设备。"
        NSBonjourServices:
          - _http._tcp.
          - _https._tcp.
          - _raop._tcp.
          - _airplay._tcp.
          - _ipp._tcp.
          - _printer._tcp.
          - _smb._tcp.
          - _ssh._tcp.
          - _services._dns-sd._udp.
        UIRequiredDeviceCapabilities:
          - arm64
