plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunflya.routerfinder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sunflya.routerfinder'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file('routerfinder.p12')
            storePassword '123456'
            keyAlias 'routerfinder'
            keyPassword '123456'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
